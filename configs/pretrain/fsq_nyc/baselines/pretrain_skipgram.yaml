misc:
  seed: 42
  num_runs: 5
  dataset: fsq_nyc
  # NYC: 3816 known locations, ranging from 2 to 3817; TKY: 6800 known locations, plus 0 padding and 1 unknown locations
  total_loc_num: 3818 #: 3818; TKY: 6802
model:
  embed_name: skipgram
  w2v_window_size: 1
  skipgram_neg: 5
  embed_size: 128

dataset:
  source_root: data/next_location/
  save_root: outputs/next_location/pretrained

training:
  num_epoch: 10
  batch_size: 64
  device: cuda:1
  learning_rate: 0.001
  print_step: 40
  patience: 5
  verbose: True
