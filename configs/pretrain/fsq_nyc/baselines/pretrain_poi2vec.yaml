misc:
  seed: 42
  num_runs: 5
  dataset: fsq_nyc
  total_loc_num: 3818 # NYC: 3818; TKY: 6802
model:
  embed_name: poi2vec
  poi2vec_theta: 0.01
  poi2vec_indi_context: False
  w2v_window_size: 1
  skipgram_neg: 5
  embed_size: 128

dataset:
  source_root: data/next_location/
  save_root: outputs/next_location/pretrained

training:
  num_epoch: 5
  device: cuda:0
  batch_size: 64
  learning_rate: 0.001
  print_step: 40
  verbose: True
